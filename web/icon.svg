<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景ベース（丸角アプリアイコン） -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- はがき台紙イメージ -->
  <g filter="url(#shadow)">
    <!-- はがき本体 (縦型) -->
    <rect x="116" y="76" width="280" height="360" rx="16" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- カッティングガイド線（トンボのイメージ） -->
    <line x1="96" y1="256" x2="416" y2="256" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="256" y1="56" x2="256" y2="456" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- 上段名刺 -->
    <rect x="136" y="96" width="240" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
    <!-- 上段名刺のコンテンツイメージ -->
    <rect x="156" y="118" width="50" height="8" rx="4" fill="#94a3b8"/>
    <rect x="156" y="136" width="110" height="16" rx="4" fill="#1e293b"/>
    <rect x="156" y="160" width="70" height="8" rx="4" fill="#64748b"/>
    <line x1="156" y1="180" x2="356" y2="180" stroke="#3b82f6" stroke-width="2"/>
    <rect x="156" y="194" width="90" height="6" rx="3" fill="#94a3b8"/>
    <rect x="156" y="206" width="110" height="6" rx="3" fill="#94a3b8"/>
    <!-- QRコードイメージ -->
    <rect x="316" y="184" width="40" height="40" rx="4" fill="#0f172a"/>
    <rect x="322" y="190" width="12" height="12" fill="#ffffff"/>
    <rect x="338" y="206" width="12" height="12" fill="#ffffff"/>

    <!-- 下段名刺 -->
    <rect x="136" y="276" width="240" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
    <!-- 下段名刺のコンテンツイメージ -->
    <rect x="156" y="298" width="50" height="8" rx="4" fill="#94a3b8"/>
    <rect x="156" y="316" width="110" height="16" rx="4" fill="#1e293b"/>
    <rect x="156" y="340" width="70" height="8" rx="4" fill="#64748b"/>
    <line x1="156" y1="360" x2="356" y2="360" stroke="#3b82f6" stroke-width="2"/>
    <rect x="156" y="374" width="90" height="6" rx="3" fill="#94a3b8"/>
    <rect x="156" y="386" width="110" height="6" rx="3" fill="#94a3b8"/>
    <!-- QRコードイメージ -->
    <rect x="316" y="364" width="40" height="40" rx="4" fill="#0f172a"/>
    <rect x="322" y="370" width="12" height="12" fill="#ffffff"/>
    <rect x="338" y="386" width="12" height="12" fill="#ffffff"/>
  </g>
</svg>
